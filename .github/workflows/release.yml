name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
      - '*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Prepare environment file
        run: |
          cp .env.example .env || touch .env

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Claude-Galaxy-A53.apk
          ls -la release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Galaxy-A53-APK
          path: release-assets/Claude-Galaxy-A53.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}
          name: "Claude for Samsung Galaxy A53 ${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}"
          body: |
            ### Claude for Samsung Galaxy — Official Android Release 📱✨

            Modern Samsung Galaxy AI client with One UI styling, multi-agent tools, live web search, executive summaries, translations, and task management.

            #### Download & Install:
            - Download **`Claude-Galaxy-A53.apk`** below to your Samsung Galaxy phone and tap to install.

            #### Features:
            - 📱 **Samsung One UI Modern Interface**: Thumb-reachable interaction zone, edge-to-edge layout, and pure AMOLED Dark theme.
            - 🤖 **Specialized AI Agents Hub**: Claude 3.5 Sonnet, Live Web Search Agent, Executive Summarizer, ELI5 Explainer, Polyglot Translator, and Task Extractor.
            - ⚡ **Quick Action Chips**: One-tap summarization, ELI5 explanation, Turkish/English translation, and task extraction.
            - 🌐 **Live Web Search**: Answers backed by real-time citations and source cards.
            - 📝 **Notes & Tasks**: Save answers directly to documents and manage calendar reminders.
            - 🔒 **Direct API Keys**: Anthropic Claude API (3.5 Sonnet / 3.7 Sonnet), Gemini, or Built-in Smart Engine.
          files: release-assets/Claude-Galaxy-A53.apk
          draft: false
          prerelease: false
